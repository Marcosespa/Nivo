<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200" fill="none">
  <defs>
    <!-- Degradado vibrante estilo Revolut: azul a magenta -->
    <linearGradient id="gradIcon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
  </defs>

  <!-- Fondo oscuro con esquinas redondeadas -->
  <rect width="200" height="200" rx="48" fill="#0A0F1C"/>

  <!-- Hexágono representando solidez y seguridad (valores bancarios) -->
  <polygon points="100,35 135,52.5 135,87.5 100,105 65,87.5 65,52.5" fill="url(#gradIcon)"/>

  <!-- Triángulo interior que simboliza crecimiento y dirección positiva -->
  <polygon points="100,58 86,85 114,85" fill="#FFFFFF"/>

  <!-- Nombre de la marca: Nivo, con tracking ajustado y peso máximo -->
  <text x="100" y="140" font-family="'Helvetica Neue', 'Arial Black', sans-serif" font-size="48" font-weight="900" fill="#F1F5F9" text-anchor="middle" dominant-baseline="middle" letter-spacing="-2">
    Nivo
  </text>

  <!-- Línea decorativa que aporta dinamismo y conexión con el degradado -->
  <line x1="70" y1="160" x2="130" y2="160" stroke="#EC4899" stroke-width="3" stroke-linecap="round"/>
</svg>
