# ═══════════════════════════════════════════════════════════════════════════════
# Nivo — Solo Bases de Datos
# ═══════════════════════════════════════════════════════════════════════════════
#
# Útil cuando desarrollas el backend localmente (fuera de Docker) y solo
# necesitas las bases de datos corriendo en contenedores.
#
# Uso:
#   docker compose -f docker_helper/docker-compose.databases.yml up -d
#   docker compose -f docker_helper/docker-compose.databases.yml down
#
# Servicios:
#   • postgres   → localhost:5432   (PostgreSQL 16)
#   • redis      → localhost:6379   (Redis 7)
#   • pgadmin    → http://localhost:5050  (admin@nivo.co / nivo_admin)
# ═══════════════════════════════════════════════════════════════════════════════

services:

  postgres:
    image: postgres:16-alpine
    container_name: nivo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: Nivo
      POSTGRES_PASSWORD: Nivo
      POSTGRES_DB: Nivo_dev
    ports:
      - "5432:5432"
    volumes:
      - nivo_postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d:ro
    networks:
      - nivo-db-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U Nivo -d Nivo_dev"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: nivo-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - nivo_redis_data:/data
    networks:
      - nivo-db-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: nivo-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@nivo.co
      PGADMIN_DEFAULT_PASSWORD: nivo_admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - nivo_pgadmin_data:/var/lib/pgadmin
    networks:
      - nivo-db-net

networks:
  nivo-db-net:
    driver: bridge
    name: nivo-db-network

volumes:
  nivo_postgres_data:
    driver: local
  nivo_redis_data:
    driver: local
  nivo_pgadmin_data:
    driver: local
