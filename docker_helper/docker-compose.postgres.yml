# Nivo — Docker Helper: Alias legacy del stack de bases de datos
# Mantiene compatibilidad con comandos anteriores.
#
# Uso:
#   docker compose -f docker_helper/docker-compose.postgres.yml up -d
#   docker compose -f docker_helper/docker-compose.postgres.yml down
#   docker compose -f docker_helper/docker-compose.postgres.yml down -v  # elimina volúmenes
#
# Conexión desde el host:
#   PostgreSQL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@localhost:5432/${POSTGRES_DB}
#   Redis:      redis://localhost:6379/0
#   pgAdmin:    http://localhost:5050  (configurar PGADMIN_* en .env)

services:

  postgres:
    image: postgres:16-alpine
    container_name: nivo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:?Set POSTGRES_USER} -d ${POSTGRES_DB:?Set POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: nivo-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --save 60 1 --loglevel warning
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: nivo-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:?Set PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:?Set PGADMIN_DEFAULT_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
#     volumes:
#       # - nivo_pgadmin_data:/var/lib/pgadmin

