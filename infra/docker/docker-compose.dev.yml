version: "3.9"

# Nivo — Docker Compose para desarrollo local
# Uso: docker-compose -f infra/docker/docker-compose.dev.yml up

services:
  api:
    build:
      context: ../../backend
      dockerfile: ../infra/docker/Dockerfile.dev
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=development
      - DATABASE_URL=postgresql+asyncpg://Nivo:Nivo@db:5432/Nivo_dev
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET_KEY=dev_secret_key_minimum_32_chars_here
      - PQC_ALGORITHM=ML-KEM-768
      - HYBRID_MODE=true
      - DEBUG=true
    volumes:
      - ../../backend:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn app.main:app --reload --host 0.0.0.0 --port 8000

  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=Nivo
      - POSTGRES_PASSWORD=Nivo
      - POSTGRES_DB=Nivo_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U Nivo"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
