# Nivo Backend CI
#
# Jobs:
#   lint            — ruff checks (fast, no services)
#   migration-check — alembic upgrade → check → downgrade → upgrade (no liboqs)
#   test            — full pytest suite against SQLite + FakeRedis (needs liboqs)
#
# Trigger: push / PR to main/develop when backend or landing changes.
#
# Branch protection (configure manually in GitHub → Settings → Branches):
#   Require status checks: lint, migration-check, test
#   Require branches to be up to date before merging
#
# Migration naming convention: NNNN_descripcion_snake_case.py
#   (e.g. 0005_add_kyc_audit_log.py)

name: CI

on:
  push:
    branches: [main, develop]
    paths:
      - "backend/**"
      - "landing_page/nivo/**"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "backend/**"
      - "landing_page/nivo/**"
      - ".github/workflows/ci.yml"

# Cancel redundant runs on the same branch/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Lint ────────────────────────────────────────────────────────────────────
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff==0.8.0
      - run: ruff check .

  # ─── Migration check ─────────────────────────────────────────────────────────
  # Installs only the minimal subset of deps that alembic/env.py actually needs.
  # No liboqs required: env.py imports ORM models (pure SQLAlchemy) + config
  # (pydantic-settings) — neither touches PQC.
  migration-check:
    name: Migration check (alembic)
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nivo
          POSTGRES_PASSWORD: nivo
          POSTGRES_DB: nivo_ci
        options: >-
          --health-cmd "pg_isready -U nivo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
    env:
      DATABASE_URL: postgresql+asyncpg://nivo:nivo@localhost:5432/nivo_ci
      JWT_SECRET_KEY: ci-placeholder-secret-key-minimum-32chars
      ENVIRONMENT: development
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install migration deps
        run: |
          pip install \
            alembic==1.13.3 \
            "sqlalchemy[asyncio]==2.0.36" \
            asyncpg==0.30.0 \
            pydantic==2.9.2 \
            pydantic-settings==2.6.0 \
            python-dotenv==1.0.1

      - name: Upgrade to head
        run: alembic upgrade head

      - name: Assert DB is at head (fails if pending migrations exist)
        run: alembic check

      - name: Smoke-test downgrade -1
        run: alembic downgrade -1

      - name: Re-apply head
        run: alembic upgrade head

  # ─── Test suite ──────────────────────────────────────────────────────────────
  # Uses SQLite (aiosqlite) + FakeRedis — no Postgres/Redis services needed.
  # liboqs C library is cached; cache key includes requirements.txt so it
  # rebuilds automatically when liboqs-python version is bumped.
  test:
    name: Test suite
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+asyncpg://nivo:nivo@localhost:5432/nivo_ci
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET_KEY: ci-placeholder-secret-key-minimum-32chars
      ENVIRONMENT: development
    steps:
      - uses: actions/checkout@v4

      # ── liboqs C library ────────────────────────────────────────────────────
      # liboqs-python uses ctypes and loads liboqs.so at import time.
      # We build liboqs from source once and cache it under /opt/liboqs.
      # Cache key: OS + requirements.txt content (so a version bump invalidates).
      - name: Cache liboqs build
        id: cache-liboqs
        uses: actions/cache@v4
        with:
          path: /opt/liboqs
          key: liboqs-ubuntu22-${{ hashFiles('backend/requirements.txt') }}

      - name: Build liboqs C library
        if: steps.cache-liboqs.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y cmake ninja-build libssl-dev
          git clone --depth 1 https://github.com/open-quantum-safe/liboqs.git /tmp/liboqs-src
          cmake -S /tmp/liboqs-src -B /tmp/liboqs-build \
            -DCMAKE_INSTALL_PREFIX=/opt/liboqs \
            -DOQS_BUILD_ONLY_LIB=ON \
            -DCMAKE_BUILD_TYPE=Release \
            -GNinja
          cmake --build /tmp/liboqs-build --parallel "$(nproc)"
          cmake --install /tmp/liboqs-build

      - name: Add liboqs to library path
        run: echo "LD_LIBRARY_PATH=/opt/liboqs/lib:$LD_LIBRARY_PATH" >> $GITHUB_ENV

      # ── Python ──────────────────────────────────────────────────────────────
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      # ── Tests ───────────────────────────────────────────────────────────────
      - name: Run tests
        run: pytest -x -q --tb=short --cov=app --cov-report=term-missing

  # ─── Landing build ─────────────────────────────────────────────────────────
  landing-build:
    name: Landing build
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: landing_page/nivo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: landing_page/nivo/package-lock.json
      - run: npm ci
      - run: npm run build
